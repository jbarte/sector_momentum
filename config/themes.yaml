# Thematic / genre ETF universe (Phase 1). One ETF per theme.
# benchmark: single global index for relative strength (SPY fallback if absent).
#
# Scoring uses the US-listed ETFs (higher liquidity, longer history).
# ucits: lists the closest EU-domiciled (UCITS) equivalent for EU investors —
# reference instruments only, not used for scoring.
# match: exact = same issuer + same index; close = same theme, different index;
#        partial = best available, meaningfully different exposure.
benchmark: ACWI
themes:
  Artificial Intelligence & Robotics:
    ticker: BOTZ
    gdelt_keywords: ["artificial intelligence", "robotics", "machine learning", "AI chip"]
  Semiconductors:
    ticker: SOXX
    gdelt_keywords: ["semiconductor", "chip maker", "chip shortage", "foundry"]
  Cybersecurity:
    ticker: CIBR
    gdelt_keywords: ["cybersecurity", "cyber attack", "data breach", "ransomware"]
  Clean Energy:
    ticker: ICLN
    gdelt_keywords: ["clean energy", "renewable energy", "solar power", "wind energy"]
  Defense:
    ticker: ITA
    gdelt_keywords: ["defense spending", "military contract", "arms deal", "defense industry"]
  Blockchain & Crypto:
    ticker: BLOK
    gdelt_keywords: ["blockchain", "cryptocurrency", "bitcoin", "crypto regulation"]
  Uranium & Nuclear:
    ticker: URA
    gdelt_keywords: ["uranium", "nuclear energy", "nuclear power", "nuclear reactor"]
  Space:
    ticker: UFO
    gdelt_keywords: ["space launch", "satellite", "space exploration", "spacecraft"]
  Lithium & Battery:
    ticker: LIT
    gdelt_keywords: ["lithium", "battery technology", "electric vehicle battery", "lithium mining"]
  Biotech:
    ticker: XBI
    gdelt_keywords: ["biotechnology", "biotech", "gene therapy", "drug approval"]
  Quantum Computing:
    ticker: QTUM
    gdelt_keywords: ["quantum computing", "quantum chip", "quantum processor", "qubit"]
  Data Centers & Digital Infra:
    ticker: DTCR
    gdelt_keywords: ["data center", "cloud infrastructure", "hyperscale", "server farm"]
  AgTech & Food Innovation:
    ticker: KROP
    # Widened 2026-08-17: the original 4 keywords are jargon that rarely
    # appears verbatim in headlines and returned 0 GDELT matches on the
    # measured day (see BACKLOG.md "GDELT source alternatives"). Added
    # broader terms that map to KROP's actual holdings (alt-protein, indoor
    # farming, ag biotech) and are more likely to appear in general coverage.
    # Deliberately excludes "food security": matching (substring, not topic
    # classification — see match_themes()) pulled in war/famine/geopolitics
    # headlines unrelated to KROP's holdings (e.g. "Russia cutting off
    # Ukraine's grain exports"). Measured 4 of 36 matches from that one term
    # alone, none about agtech companies — dropped for a cleaner signal.
    gdelt_keywords: [
      "agtech", "precision agriculture", "food technology", "vertical farming",
      "alternative protein", "plant-based food", "cultivated meat",
      "indoor farming", "agricultural technology", "crop science",
      "gene-edited crops",
    ]

  # --- Diversifiers (added 2026-08-05, trimmed 2026-08-09) -----------------
  # Originally seven names chosen purely to lower cohort pairwise correlation,
  # which they did (rho 0.52 -> 0.375). The 2026-08-09 audit then asked whether
  # that bought anything, and mostly it did not: correlation fell, but drawdown
  # did not, because in the crashes that matter everything falls together.
  #
  # Removed: Energy Producers (IXC) and Medical Devices (IHI). Both hurt the
  # backtest at EVERY buffer setting tested (5/5), and drawdown was 5.8pp and
  # 3.5pp *better* without them.
  #
  # Kept, but note WHY, because it is not the original reason:
  #   Insurance, Healthcare Providers — earn their place on RETURN, not on
  #     diversification (dropping either costs CAGR).
  #   Gold & Precious Metals Miners — the only one that genuinely cuts drawdown,
  #     and it charges ~1.4pp of CAGR for ~1.1pp of relief.
  #   Shipping, Food & Beverage — ambiguous; left alone rather than trimmed
  #     further on thin evidence.
  #
  # Lesson for any future universe change: a correlation screen cannot see
  # whether a name is simply worse. Judge on the backtest, at matched window and
  # matched band.
  Insurance:
    ticker: IAK
    gdelt_keywords: ["insurance industry", "insurer earnings", "reinsurance", "property casualty insurance"]
  Healthcare Providers:
    ticker: IHF
    gdelt_keywords: ["health insurer", "hospital operator", "managed care", "healthcare costs"]
  Gold & Precious Metals Miners:
    ticker: GDX
    gdelt_keywords: ["gold mining", "gold price", "precious metals", "gold miner"]
  Shipping:
    ticker: BOAT
    # No UCITS equivalent exists, so this cannot be bought from an EU account.
    # Verified on justETF 2026-08-10, not recalled: `shipping`, `maritime`,
    # `freight`, `marine` and `transport` all return 0 across the European
    # UCITS universe (`robotics` returns 7, so the search itself works). The one
    # candidate this config ever noted, ETFS DAXglobal Shipping GO
    # (IE00B3CMS880), is confirmed liquidated — last NAV 2014-09-05.
    #
    # `unbuyable` means SCORED BUT NEVER HELD. It keeps shaping the
    # cross-sectional z-scores (dropping it measured worse on the default
    # Medium preset), but the leaderboard will not prompt an entry and
    # strategy.simulate will not put it in the book. Delete this line the day a
    # UCITS shipping product launches.
    unbuyable: true
    # Widened 2026-08-17: only 1 GDELT match on the measured day (see
    # BACKLOG.md "GDELT source alternatives"). BOAT tracks Baltic Exchange
    # dry-bulk freight futures (Capesize/Panamax/Supramax), a narrower and
    # more specific market than "shipping" in general — added the dry-bulk
    # terms actually driving this ETF, on top of the existing broader ones.
    # This is the longest keyword list in this file (11 terms, ~230-char
    # OR-joined query for the DOC API fallback in news_sentiment.py) — a
    # live probe got GDELT's 429 rate-limit body, not 400/414, so the length
    # is not being rejected as malformed, but actual fallback results are
    # unconfirmed (this IP is under the same long-window throttle noted in
    # the GDELT bulk-fetch work). If future themes need keyword lists this
    # long, that assumption is worth re-checking with a cooled-down IP.
    gdelt_keywords: [
      "container shipping", "freight rates", "shipping industry", "tanker rates",
      "dry bulk shipping", "baltic dry index", "capesize", "panamax",
      "bulk carrier", "charter rates", "iron ore shipping",
    ]
  Food & Beverage:
    ticker: PBJ
    gdelt_keywords: ["food company", "beverage industry", "food prices", "packaged food"]


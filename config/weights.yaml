# Sentiment uses FinBERT news polarity (ProsusAI/finbert over GDELT headlines).
# The composite score is pure data (blend_sentiment=False) and always has been.
#
# Sentiment is ALPHA since 2026-08-14 and moves nothing: the dashboard control
# that blended it into the ranking was withdrawn, and the leaderboard's
# Sentiment column is hidden. Google Trends was removed from the pipeline
# entirely — it is not an info-only source, it is gone.

# Within data pillar: level vs change split
data_pillar:
  level: 0.50
  change: 0.50

# Signal display ordering for the dashboard breakdown panel.
# The actual equal-weight signal lists are hardcoded in src/scoring.py
# (_LEVEL_SIGNALS, _CHANGE_SIGNALS); these keys control column order in
# dashboard/build.py only. Values are ignored.
level_signals:
  rs_ratio: 1.0
  return_3m: 1.0
  return_6m: 1.0
  above_50dma: 1.0

change_signals:
  rs_momentum: 1.0
  return_1m: 1.0
  ma50_slope: 1.0
  obv_slope: 1.0

# Signal computation parameters
signal_params:
  rs_momentum_fast: 5     # RRG RS-Momentum lookback (was 1; standard RRG ~10)

# ---------------------------------------------------------------------------
# Trading costs.
#
# `round_trip_bps` is the all-in cost of replacing one position: commission on
# the sell AND the buy, plus the bid/ask spread you cross on both sides. It is
# applied to the fraction of the book that turns over each rebalance
# (src/backtest/strategy.py), so it is a ROUND-TRIP rate, not one-way.
#
# This defaulted to 0 until 2026-08-09, which mattered more than it sounds:
# the horizon presets were originally *selected* by a sweep that assumed free
# trading, and free trading systematically favours the cadence that trades most.
#
# HISTORICAL — the table below is from the three-preset era and `Short` no
# longer exists (removed 2026-08-14). Kept because the shape is the point: the
# ranking inverts with cost, which is why this value is never 0 again.
#
#   cost |  Short | Medium |  Long
#      0 |  17.4% |  16.1% | 14.2%
#     50 |  14.8% |  15.0% | 13.7%
#    100 |  12.2% |  13.9% | 13.2%
#
# 100 bps is Jonas's real Avanza cost, read off their own fee disclosure for
# L&G ROBO Global Robotics (the UCITS equivalent of BOTZ) on a 10 000 SEK
# position: "Avgifter för köp och sälj — Avanzas avgifter: 100 SEK / 1%". That
# heading covers both legs, so it is already round-trip.
#
# Deliberately EXCLUDED from this number, because they are annual drags rather
# than per-trade costs and would be billed per turnover if they lived here:
#   - Löpande avgifter 0.8%  — the fund's TER
#   - Transaktionsavgifter 0.03% — the fund's own internal dealing costs
# Neither is modelled anywhere in the backtest. See BACKLOG.
#
# CAVEAT: if Avanza's 100 SEK is a per-trade *minimum* rather than a true
# percentage, this rate falls as position size rises — roughly 40 bps at
# 25 000 SEK, 20 bps at 50 000 SEK. That mattered when a weekly preset existed;
# it no longer does, and the 2026-08-14 re-sweep picked the same cells at 70 and
# at 100 bps, so the choice is not sensitive in this range. Researched real
# all-in cost for this ISK account is ~65-80 bps (FX dominates courtage) — the
# shipped 100 is deliberately conservative. Recheck against a real trade
# confirmation if position sizing changes materially.
costs:
  round_trip_bps: 100

# ---------------------------------------------------------------------------
# Horizon presets — how long to hold, and how much churn that costs.
#
# Each preset is a (rebalance cadence, top_n, hysteresis buffer) triple. The
# CURRENT cells were picked on 2026-08-14 by `scripts/horizon_sweep.py`, run on
# warm history at 70 and 100 bps over two windows (see the re-pick note below).
#
# The `2026-08-08-horizon-sweep-results-*.md` files in sector_momentum-notes are
# the ORIGINAL selection, at 0 and 10 bps, for a three-preset lineup that no
# longer exists. They are history, not the justification for these cells — do
# not re-derive from them. The sweep is reproducible in one command:
# `python3 scripts/horizon_sweep.py --cost-bps 70`.
#
# `buffer` is the hysteresis band IN RANKS: a holding is kept while its rank
# stays within top_n + buffer, so a one-rank wobble no longer forces a trade.
# It is the single biggest churn lever — far more than the cadence.
#
# THE TWO PRESETS SHARE A CADENCE. Both rebalance monthly; what separates them
# is the width of the hold band. That is the whole design, and it is what the
# 2026-08-14 warm sweep found: cadence barely moves the result, band width does
# the work, and no weekly cell won anything on either window.
#
# (They also differ slightly in book size — `medium` holds 4, `long` holds 5.
# That is a consequence of which cells won, not part of the design: don't
# describe the two as differing ONLY in band width.)
#
# The band as a FRACTION of the universe is what generalises:
# (top_n + buffer) / n_themes. THE BACKTEST PRICES 18 THEMES (20 are configured;
# two have no usable price history), so the shipped cells sit at 9/18 = 50% for
# `medium` and 13/18 = 72% for `long`. Keep that denominator in mind before
# recomputing — against the 20 configured themes the same cells read 45% / 65%.
#
# HISTORICAL — under the OLD absolute-rank mechanism, growing the universe from
# 13 to 20 themes on 2026-08-05 silently tightened the band from 62% to 40% and
# tripled churn, because a rank count doesn't move when the denominator does.
# The 2026-08-30 fractional-band migration (below) replaced `buffer` with
# `buffer_frac`, a fraction of the scored universe, so the band now scales
# automatically as themes are added or removed — this class of drift can't
# recur. Kept here as the reason `buffer_frac` exists, not as live guidance.
#
# These are PRECOMPUTED OPERATING POINTS from one sweep over one market
# history, not a live optimiser. The recorded cagr/trades_per_year are the
# backtested figures for that cell and exist so the UI can show the churn cost
# next to the return; they are not predictions.
#
# `cagr` is NET of costs.round_trip_bps (below). trades_per_year and
# median_holding_days are unchanged by cost — the cost model is applied to
# returns, never to selection, so the same names are picked either way.
#
# CUT FROM THREE PRESETS TO TWO, 2026-08-14. `short` is gone, not re-tuned.
# Re-swept on warm history (the sweep starved its own signal warm-up until
# 2026-08-13 and produced inverted answers before that — see BACKLOG), at 100
# bps and again at the ~70 bps an ISK account really pays, on 2008- and 2015-:
#
#   medium  M/5/4  -> M/4/5   15.0->15.6% CAGR, 0.84->0.85 Sharpe,
#                             16.8->12.9 trades/yr, maxDD -35.4 -> -30.8%
#   long    2M/4/6 -> M/5/8   14.1->14.0% CAGR, 0.73->0.78 Sharpe,
#                             7.4->6.9 trades/yr, hold 182 -> 183 days
#   short   W/3/6  -> removed
#
# `M/4/5` is the best cell in the whole grid on both windows — top Sharpe AND
# shallowest drawdown — and it beats the `M/5/4` it replaces on return, churn
# and drawdown at once. `M/5/8` does what `long` existed for (≈7 trades/yr,
# half-year holds) on a monthly cadence, and beats the 2M cell it replaces on
# Sharpe in both windows.
#
# WHY `short` WENT RATHER THAN BEING RE-TUNED: it was a cadence choice, and the
# warm sweep says cadence is not where the return is. Every weekly cell was
# dominated. Its last incarnation (W/3/6, shipped 2026-08-13) had already drifted
# to trading LESS per year than `medium`, which made the three-way lineup
# actively misleading.
#
# The two remaining presets still order by holding period, 120 vs 183 days, and
# now by trades/yr as well (12.9 vs 6.9) — the inversion that forced
# test_presets_are_ordered_by_holding_period to be relaxed is gone.
#
# `default` is what the baked page renders AND what alerts evaluate — not by
# being passed anywhere, but because `detect_badge_events` calls
# `_compute_setup(row)` with no horizon and that falls back to
# `default_horizon()`. Signed-in users can switch preset client-side; that choice
# lives in localStorage and never reaches the scan, so the alerts modal states
# which band is in force and warns when the reader has switched. Per-user
# horizon was considered and deliberately NOT built (2026-08-14, see Done).
#
# HOW MUCH CONFIDENCE THESE NUMBERS DESERVE — measured 2026-08-30, and it is
# not the same for the two presets. Bands are ABSOLUTE ranks, so a preset's
# SELL line cannot fire until the scored universe is larger than its
# `exit_rank = top_n + buffer`, and this universe grew from 10 priced themes in
# 2015 to 18 in 2023. `scripts/horizon_sweep.py` now reports this as the `live`
# column, per cell:
#
#   medium  M/4/5  exit_rank  9  -> live on 100% of the 2015- monthly calendar
#   long    M/5/8  exit_rank 13  -> live on  68%  (first fires 2018-09-28)
#
# So `medium` is measured on evidence that exercises its rule throughout, and
# the "best cell in the whole grid" claim above stands. `long` is roughly a
# third buy-and-hold over that window by construction — its return is flattered
# by the years it could not sell, and it is NOT comparable to an interior cell.
# Treat its cagr/trades_per_year below as descriptive of the operating point,
# not as evidence it is the optimum.
#
# The 2026-08-30 sweep also widened the buffer grid past 8 (where `long` used to
# sit on the maximum) specifically to check whether anything better lay outside.
# Nothing does: every cell past it is MORE degenerate, not less — exit_rank 15
# is live on 50% of the window and exit_rank 18 never fires at all.
#
# CONSEQUENCE FOR `long`'s PUBLISHED cagr/trades_per_year/median_holding_days
# BELOW: they are rendered verbatim in the dashboard's horizon chip, and they
# were measured on a window where the band was dead 31% of the time. At today's
# 18 priced themes exit_rank 13 is ALWAYS live, so realized churn will run well
# above the 6.9 trades/yr the chip promises — the same cell on a fair 2022-
# window measures 16.9 trades/yr and a 180-day hold. The figures were left
# alone here rather than quietly rewritten: what the chip should promise is a
# product decision, not a sweep output. Queued in BACKLOG.md.
#
# NOISE FLOOR — the number to check any of this against. On two DISJOINT
# windows (2015-2021, n=84 rebalances; 2022-, n=56), the same cell's CAGR moves
# by a median of 2.2pp, while cell-to-cell spread within a window is ~9pp.
# Cross-window rank correlation is only +0.33. Two cells less than ~2pp apart
# are therefore indistinguishable, and picking a window's argmax overfits: the
# best cell in 2022- ranks 10th of 26 in 2015-2021. `medium` survives this test
# — best in 2015-2021 and 4th of 26 in 2022- — which is the real reason to keep
# it, rather than any single-window margin.
#
# FRACTIONAL BAND MIGRATION, 2026-08-30 — `buffer` (an absolute rank count) is replaced by
# `buffer_frac` (a fraction of the scored universe), so a preset's selectivity stays stable
# as the theme universe grows instead of silently drifting every time a theme is added or
# removed. See sector_momentum-notes/specs/2026-08-30-fractional-hysteresis-band-design.md.
#
# The two values below were chosen so exit_rank is UNCHANGED at today's 18-theme universe —
# this migration is a no-op on rollout day; only future universe growth diverges from what
# absolute ranks would have done.
#
# The cagr/trades_per_year/median_holding_days figures below were measured under the OLD
# absolute-rank simulation across ALL of history, not just today's universe size — they are
# now PROVISIONAL until a fresh sweep re-validates them under fractional bands (queued
# separately; out of scope for the mechanism this migration ships).
horizons:
  default: medium
  presets:
    medium:
      label: Medium
      rebalance: M
      top_n: 4
      buffer_frac: 0.277778  # = 5/18: reproduces exit_rank 9 at today's 18-theme
                             # universe exactly (round(0.277778*18) = 5). See
                             # 2026-08-30 fractional-band migration below.
      cagr: 0.156
      trades_per_year: 12.9
      median_holding_days: 120
    long:
      label: Long
      rebalance: M
      top_n: 5
      buffer_frac: 0.444444  # = 8/18: reproduces exit_rank 13 at today's 18-theme
                             # universe exactly (round(0.444444*18) = 8).
      cagr: 0.140
      trades_per_year: 6.9
      median_holding_days: 183
